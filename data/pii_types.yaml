# PII type registry. Adding a new type needs no code: patterns, context words and
# validator are data. Patterns are case-insensitive and unicode.
# Types with empty `patterns` are detected by dictionaries/context in a later task (T05).
# Global context markers apply to every type unless a type overrides them via
# `non_pii_markers` / `pii_markers`.
