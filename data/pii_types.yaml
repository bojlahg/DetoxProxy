types:
  - id: fio
    name: Full name
    token_label: FIO
    context_words: [клиент, гражданин, физлицо, заявитель, ф.и.о, фио]
    pii_context: [клиент, гражданин, заявитель, заёмщик, держатель, пользователь, сотрудник, фио, паспорт, родился, проживает, зарегистрирован, телефон, прошу, мой, моя, меня, зовут]
    non_pii_context: [поэт, писатель, композитор, художник, учёный, режиссёр, актёр, президент, памятник, музей, улица имени, роман, стихотворение, произведение, автор, книга]
    patronymic_suffixes: [ович, евич, ич, овна, евна, ична, инична]
    surname_suffixes: [ов, ев, ин, ын, ский, цкий, ова, ева, ина, ская, цкая, ко, ук, юк, ян, дзе]
    # Case endings stripped from a first name before dictionary lookup (oblique cases).
    first_name_case_endings: [у, ю, а, я, е, ом, ем, ой, ей, ым, им, ого, ему]
    # Suffixes stripped from a surname in oblique cases before dictionary lookup.
    surname_case_suffixes: [ову, еву, ину, ым, ой, овой, евой, иной, ского, скому, ской]
    patterns: []

  - id: birth_date
    name: Birth date
    token_label: BDATE
    context_words: [родился, родилась, дата рождения, д.р, г.р, "др:", day of birth, рождения, года рождения, год рождения, г. р]
    date_suffixes: [" г.", " года"]
    patterns:
      - '\b\d{1,2}[./-]\d{1,2}[./-]\d{2,4}\b'
      - '\b\d{4}-\d{2}-\d{2}\b'
      - '\b\d{1,2}\s+[а-яё]+\s+\d{2,4}\b'
      - '\b[а-яё]+\s+[а-яё]+\s+\d{2,4}\b'

  - id: birth_place
    name: Birth place
    token_label: BPLACE
    context_words: [место рождения, родился, родилась, уроженец, уроженка]
    strong_markers: [место рождения, уроженец, уроженка]
    patterns: []

  - id: passport
    name: Passport series and number
    token_label: PASSPORT
    context_words: [паспорт, паспорта, паспорте, паспорту, паспортом, серия, серии, серию, серий, паспортные данные]
    validator: none
    stars_keep_prefix: 2
    stars_keep_suffix: 2
    patterns:
      - '\b\d{4} \d{6}\b'
      - '\b\d{2} \d{2} \d{6}\b'
      - '\b\d{10}\b'
      - '\b\d{4} номер \d{6}\b'
      - '\b\d{2} \d{2} номер \d{6}\b'
      - '\b\d{4}, номер: \d{6}\b'
      - '\b\d{2} \d{2}, номер: \d{6}\b'
      - '\b\d{4}[,\s]+номер\s+\d{6}\b'
      - '\b\d{2} \d{2}[,\s]+номер\s+\d{6}\b'
      - '\b\d{2}[,\s]+номер\s+\d{6}\b'
      - '\b\d{4}[,\s]+а номер\s+\d{3} - \d{3}\b'
      - '\b\d{2} \d{2}[,\s]+и номер\s+\d{3} \d{3}\b'
      - '\b\d{2} \d{2}[,\s]+а номер\s+\d{6}\b'
      - '\b\d{2} \d{2}[,\s]+а номер\s+паспорта\s+\d{6}\b'
      - '\b\d{4}[,\s]+№\s+\d{6}\b'

  - id: citizenship
    name: Citizenship
    token_label: CITIZEN
    context_words: [гражданство, гражданин, гражданка]
    patterns: []

  - id: passport_issuer
    name: Passport issuing authority
    token_label: PASSISS
    context_words: [выдан, кем выдан, выдано, выдал, орган]
    patterns: []

  - id: subdivision_code
    name: Passport subdivision code
    token_label: SUBDIV
    context_required: true
    context_words: [код подразделения, к/п, подразделения]
    patterns:
      - '\b\d{3}-\d{3}\b'

  - id: passport_issue_date
    name: Passport issue date
    token_label: ISSDATE
    context_words: [дата выдачи, выдан, выдана, выдано, выдачи]
    date_suffixes: [" г.", " года"]
    patterns:
      - '\b\d{1,2}[./-]\d{1,2}[./-]\d{2,4}\b'
      - '\b\d{4}-\d{2}-\d{2}\b'
      - '\b\d{1,2}\s+[а-яё]+\s+\d{2,4}\b'
      - '\b[а-яё]+\s+[а-яё]+\s+\d{2,4}\b'

  - id: driver_license
    name: Driver license series and number
    token_label: DRIVLIC
    context_required: true
    context_words: [в/у, ву, водительское, удостоверение, права]
    patterns:
      - '\b\d{2} \d{2} \d{6}\b'
      - '\b\d{4} \d{6}\b'
      - '\b\d{2} [А-ЯЁ]{2} \d{6}\b'

  - id: address
    name: Address
    token_label: ADDR
    context_words: [адрес, проживает, зарегистрирован, прописан, индекс]
    pii_markers: [проживает, живёт, адрес регистрации, зарегистрирован, прописан]
    non_pii_markers: [отделение, отделении, офис, офисе, филиал, банк, банка, адрес банка]
    patterns: []

  - id: email
    name: Email address
    token_label: EMAIL
    validator: email
    patterns:
      - '[A-Za-z0-9._+\-]+@[A-Za-z0-9\-]+(?:\.[A-Za-z0-9\-]+)+'

  - id: phone
    name: Phone number
    token_label: PHONE
    validator: phone
    stars_keep_prefix: 2
    stars_keep_suffix: 2
    non_pii_markers: [версия, сборка, build, version, релиз, ver, пример, тест, тестовый, образец, шаблон]
    patterns:
      - '(?:\+7|\b(?:8|7))[\s\-().]*\d{3}[\s\-().]*\d{3}[\s\-().]*\d{2}[\s\-().]*\d{2}'
      - '\(\d{3}\)[\s\-().]*\d{3}[\s\-().]*\d{2}[\s\-().]*\d{2}'

  - id: inn
    name: Taxpayer identification number
    token_label: INN
    validator: inn
    context_words: [инн]
    patterns:
      - '\b(?:\d{10}|\d{12})\b'

  - id: card_number
    name: Bank card number
    token_label: CARD
    validator: luhn
    stars_keep_prefix: 4
    stars_keep_suffix: 4
    context_words: [карта, card, номер карты, "№ карты"]
    patterns:
      - '(?:\d[ -]?){12,18}\d'

  - id: cvv
    name: Card verification value
    token_label: CVV
    context_required: true
    requires_companion: true
    context_words: [cvv, cvc, cvv2, cvc2, код безопасности, защитный код]
    patterns:
      - '\d{3,4}\b'

  - id: card_pin
    name: Card PIN code
    token_label: PIN
    context_required: true
    requires_companion: true
    context_words: [пин, pin, пин-код, pin-код]
    patterns:
      - '\d{4}\b'

  - id: card_holder
    name: Card holder name
    token_label: CARDHLD
    context_words: [держатель, cardholder, holder, на имя, владелец карты]
    patterns: []

  - id: snils
    name: Insurance number of individual account
    token_label: SNILS
    validator: snils
    patterns:
      - '\b\d{3}-\d{3}-\d{3} \d{2}\b'
      - '\b\d{11}\b'