<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DetoxProxy — демо</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #f5f6f8;
    color: #1f2430;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 24px 16px 48px; }
  header { margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #6b7280; font-size: 14px; }
  .links { margin-top: 8px; font-size: 14px; }
  .links a { color: #2563eb; text-decoration: none; margin-right: 16px; }
  .links a:hover { text-decoration: underline; }
  .card {
    background: #ffffff;
    border: 1px solid #d9dde3;
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
  textarea, select {
    width: 100%;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px;
    border: 1px solid #d9dde3;
    border-radius: 6px;
    padding: 8px;
    background: #fff;
    color: #1f2430;
  }
  textarea { min-height: 120px; resize: vertical; }
  .row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
  .row .field { flex: 1; min-width: 180px; }
  .btn {
    border: none;
    border-radius: 6px;
    padding: 9px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    background: #2563eb;
    color: #fff;
  }
  .btn:hover { background: #1d4ed8; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.secondary { background: #e5e7eb; color: #1f2430; }
  .btn.secondary:hover { background: #d1d5db; }
  .meta { font-size: 13px; color: #6b7280; margin-top: 8px; }
  .meta .status-ok { color: #16a34a; font-weight: 600; }
  .meta .status-err { color: #dc2626; font-weight: 600; }
  .out {
    margin-top: 10px;
    border: 1px solid #d9dde3;
    border-radius: 6px;
    padding: 10px;
    background: #fafbfc;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px;
    min-height: 40px;
  }
  .out .placeholder { color: #6b7280; }
  .detect-box { margin-top: 10px; }
  .detect-box .src {
    border: 1px solid #d9dde3;
    border-radius: 6px;
    padding: 10px;
    background: #fafbfc;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.9;
    white-space: pre-wrap;
    word-break: break-word;
  }
  mark {
    background: #fde68a;
    border-radius: 3px;
    padding: 0 2px;
  }
  .tag {
    font-size: 10px;
    font-weight: 700;
    color: #92400e;
    background: #fef3c7;
    border: 1px solid #fcd34d;
    border-radius: 3px;
    padding: 0 3px;
    margin-left: 2px;
    vertical-align: super;
  }
  .err-text { color: #dc2626; }
  .hint { font-size: 12px; color: #6b7280; margin-top: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>DetoxProxy — демо</h1>
    <div class="sub">Маскирование и восстановление персональных данных</div>
    <div class="links">
      <a href="/metrics">/metrics</a>
      <a href="/healthz">/healthz</a>
    </div>
  </header>

  <div class="card">
    <div class="row">
      <div class="field">
        <label for="system">Система</label>
        <select id="system">
          <option value="autotest">autotest</option>
          <option value="chatbot">chatbot</option>
          <option value="strict">strict</option>
        </select>
      </div>
      <div class="field" style="flex:2">
        <label for="payload">Исходный текст</label>
        <textarea id="payload">Клиент Сидоров Пётр Иванович, 12.03.1985 г.р., паспорт 4509 123456, ИНН 500100732259, тел. +7 912 345-67-89, email petr.sidorov@mail.ru, карта 4276 5500 1122 3347, CVV 317. Проживает: г. Казань, ул. Баумана, д. 14, кв. 8.</textarea>
      </div>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn" id="maskBtn">Замаскировать</button>
      <button class="btn secondary" id="detectBtn">Показать найденное</button>
    </div>
    <div class="meta" id="maskMeta"></div>
    <div class="out" id="maskOut"><span class="placeholder">Результат маскирования появится здесь</span></div>
    <div class="detect-box" id="detectBox" hidden>
      <div class="meta" id="detectMeta"></div>
      <div class="src" id="detectSrc"></div>
    </div>
  </div>

  <div class="card">
    <div class="field">
      <label for="llm">Ответ LLM (маска)</label>
      <textarea id="llm" placeholder="Сюда копируется маска; можно отредактировать, например: Уважаемый &lt;&lt;FIO_1:дат&gt;&gt;..."></textarea>
    </div>
    <div class="hint">Нажмите «Замаскировать», чтобы скопировать маску сюда, затем отредактируйте и нажмите «Восстановить».</div>
    <div class="row" style="margin-top:12px">
      <button class="btn" id="unmaskBtn">Восстановить</button>
    </div>
    <div class="meta" id="unmaskMeta"></div>
    <div class="out" id="unmaskOut"><span class="placeholder">Результат восстановления появится здесь</span></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  const payloadEl = document.getElementById("payload");
  const systemEl = document.getElementById("system");
  const llmEl = document.getElementById("llm");
  const maskBtn = document.getElementById("maskBtn");
  const detectBtn = document.getElementById("detectBtn");
  const unmaskBtn = document.getElementById("unmaskBtn");
  const maskOut = document.getElementById("maskOut");
  const maskMeta = document.getElementById("maskMeta");
  const detectBox = document.getElementById("detectBox");
  const detectMeta = document.getElementById("detectMeta");
  const detectSrc = document.getElementById("detectSrc");
  const unmaskOut = document.getElementById("unmaskOut");
  const unmaskMeta = document.getElementById("unmaskMeta");

  let currentPayloadId = null;

  function randomId() {
    const arr = new Uint8Array(16);
    crypto.getRandomValues(arr);
    let hex = "";
    for (let j = 0; j < arr.length; j++) hex += ("0" + arr[j].toString(16)).slice(-2);
    return hex;
  }

  function setText(el, text) {
    el.textContent = text;
  }

  function setMeta(el, ms, status, errText) {
    el.textContent = "";
    let first = true;
    function sep() {
      if (!first) el.appendChild(document.createTextNode(" \u00b7 "));
      first = false;
    }
    if (status !== null) {
      const st = document.createElement("span");
      st.className = status >= 200 && status < 300 ? "status-ok" : "status-err";
      st.textContent = "HTTP " + status;
      sep();
      el.appendChild(st);
    }
    if (ms !== null) {
      sep();
      el.appendChild(document.createTextNode("время: " + ms + " мс"));
    }
    if (errText) {
      sep();
      const err = document.createElement("span");
      err.className = "err-text";
      err.textContent = "ошибка: " + errText;
      el.appendChild(err);
    }
  }

  function post(path, body) {
    const started = performance.now();
    return fetch(path, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-System-Id": systemEl.value
      },
      body: JSON.stringify(body)
    }).then(function (resp) {
      const ms = Math.round(performance.now() - started);
      return resp.text().then(function (text) {
        let json = null;
        try { json = JSON.parse(text); } catch (e) { json = null; }
        return { status: resp.status, ms: ms, text: text, json: json };
      });
    }).catch(function (err) {
      const ms = Math.round(performance.now() - started);
      return { status: 0, ms: ms, text: String(err), json: null };
    });
  }

  function errorMessage(res) {
    if (res.json && res.json.error) {
      if (typeof res.json.error === "string") return res.json.error;
      if (res.json.error.message) return res.json.error.message;
    }
    if (res.json && res.json.message) return res.json.message;
    return res.text || "неизвестная ошибка";
  }

  function mask() {
    const payload = payloadEl.value;
    currentPayloadId = randomId();
    maskBtn.disabled = true;
    setText(maskOut, "…");
    setMeta(maskMeta, null, null, null);
    post("/process", { payload: payload, payload_id: currentPayloadId }).then(function (res) {
      maskBtn.disabled = false;
      setMeta(maskMeta, res.ms, res.status, res.status >= 200 && res.status < 300 ? null : errorMessage(res));
      if (res.status >= 200 && res.status < 300 && res.json && typeof res.json.result === "string") {
        setText(maskOut, res.json.result);
        llmEl.value = res.json.result;
      } else {
        setText(maskOut, errorMessage(res));
      }
    });
  }

  function detect() {
    const payload = payloadEl.value;
    detectBtn.disabled = true;
    setText(detectSrc, "…");
    setMeta(detectMeta, null, null, null);
    detectBox.hidden = false;
    post("/v1/detect", { text: payload }).then(function (res) {
      detectBtn.disabled = false;
      setMeta(detectMeta, res.ms, res.status, res.status >= 200 && res.status < 300 ? null : errorMessage(res));
      if (res.status >= 200 && res.status < 300 && res.json && Array.isArray(res.json.entities)) {
        renderDetect(payload, res.json.entities);
      } else {
        setText(detectSrc, errorMessage(res));
      }
    });
  }

  function renderDetect(text, entities) {
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();
    const bytes = encoder.encode(text);
    const sorted = entities.slice().sort(function (a, b) { return a.start - b.start; });
    const root = document.createElement("div");
    let pos = 0;
    for (let i = 0; i < sorted.length; i++) {
      const e = sorted[i];
      const start = Math.max(0, e.start);
      const end = Math.min(bytes.length, e.end);
      if (end <= start) continue;
      if (start > pos) {
        root.appendChild(document.createTextNode(decoder.decode(bytes.subarray(pos, start))));
      }
      const mark = document.createElement("mark");
      mark.appendChild(document.createTextNode(decoder.decode(bytes.subarray(start, end))));
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = e.type || "unknown";
      mark.appendChild(tag);
      root.appendChild(mark);
      pos = end;
    }
    if (pos < bytes.length) {
      root.appendChild(document.createTextNode(decoder.decode(bytes.subarray(pos))));
    }
    detectSrc.textContent = "";
    detectSrc.appendChild(root);
  }

  function unmask() {
    const text = llmEl.value;
    if (!currentPayloadId) {
      setMeta(unmaskMeta, null, null, "сначала нажмите «Замаскировать»");
      setText(unmaskOut, "Нет payload_id: сначала замаскируйте текст.");
      return;
    }
    unmaskBtn.disabled = true;
    setText(unmaskOut, "…");
    setMeta(unmaskMeta, null, null, null);
    post("/process", { payload: text, payload_id: currentPayloadId }).then(function (res) {
      unmaskBtn.disabled = false;
      setMeta(unmaskMeta, res.ms, res.status, res.status >= 200 && res.status < 300 ? null : errorMessage(res));
      if (res.status >= 200 && res.status < 300 && res.json && typeof res.json.result === "string") {
        setText(unmaskOut, res.json.result);
      } else {
        setText(unmaskOut, errorMessage(res));
      }
    });
  }

  maskBtn.addEventListener("click", mask);
  detectBtn.addEventListener("click", detect);
  unmaskBtn.addEventListener("click", unmask);
})();
</script>
</body>
</html>
